<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-label="Architecture of the QLoRA plus Dr.ICL pipeline. A single build_splits call partitions the dataset into train, validation and test, and emits a fingerprint that both entry points print. The training lane tokenizes the train split with completion-only labels, attaches LoRA adapters to a 4-bit quantized base model, and emits an adapter. The evaluation lane retrieves demonstrations from the train split only, guarded by an assert_no_leakage check, builds an in-context prompt around the test split, generates from the merged base plus adapter, and scores the continuation alone with a BERTScore judge." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0550ae"/>
    </marker>
  </defs>
  <rect width="1280" height="700" fill="#ffffff"/>
  <text x="30" y="36" text-anchor="start" font-size="17" font-weight="700" fill="#1f2328">QLoRA + Dr.ICL pipeline</text>
  <text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#59636e">One deterministic partition feeds both lanes. Demonstrations are retrieved from train, never from the split being scored.</text>
  <text x="640" y="108" text-anchor="start" font-size="11" font-weight="700" fill="#59636e">TRAINING</text>
  <text x="880" y="364" text-anchor="start" font-size="11" font-weight="700" fill="#59636e">EVALUATION</text>
  <rect x="30" y="300" width="150" height="56" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="105.0" y="323.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">HF dataset</text>
  <text x="105.0" y="340.0" text-anchor="middle" font-size="11" fill="#59636e">ChatDoctor / GSM8K</text>
  <rect x="225" y="286" width="180" height="84" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="315.0" y="315.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">build_splits()</text>
  <text x="315.0" y="332.0" text-anchor="middle" font-size="11" fill="#59636e">seed · max_samples</text>
  <text x="315.0" y="348.0" text-anchor="middle" font-size="11" fill="#59636e">→ split fingerprint</text>
  <rect x="455" y="140" width="110" height="40" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="510.0" y="165.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">train 80%</text>
  <rect x="455" y="306" width="110" height="40" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="510.0" y="331.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">val 10%</text>
  <rect x="455" y="500" width="110" height="40" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="510.0" y="525.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">test 10%</text>
  <rect x="640" y="124" width="180" height="72" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="730.0" y="147.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">tokenize</text>
  <text x="730.0" y="164.0" text-anchor="middle" font-size="11" fill="#59636e">completion-only labels</text>
  <text x="730.0" y="180.0" text-anchor="middle" font-size="11" fill="#59636e">pad + prompt → −100</text>
  <rect x="880" y="124" width="180" height="72" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="970.0" y="147.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">4-bit NF4 base</text>
  <text x="970.0" y="164.0" text-anchor="middle" font-size="11" fill="#59636e">+ LoRA adapters</text>
  <text x="970.0" y="180.0" text-anchor="middle" font-size="11" fill="#59636e">r=8, ~0.2% trainable</text>
  <rect x="1120" y="132" width="130" height="56" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="1185.0" y="155.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">LoRA adapter</text>
  <text x="1185.0" y="172.0" text-anchor="middle" font-size="11" fill="#59636e">a few MB</text>
  <rect x="640" y="380" width="180" height="64" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="730.0" y="407.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">GTR-T5 retriever</text>
  <text x="730.0" y="424.0" text-anchor="middle" font-size="11" fill="#59636e">top-k demonstrations</text>
  <rect x="640" y="486" width="180" height="64" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="730.0" y="513.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">ICL prompt</text>
  <text x="730.0" y="530.0" text-anchor="middle" font-size="11" fill="#59636e">k demos + question</text>
  <rect x="880" y="486" width="180" height="64" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="970.0" y="513.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">base + adapter</text>
  <text x="970.0" y="530.0" text-anchor="middle" font-size="11" fill="#59636e">merged for inference</text>
  <rect x="1120" y="486" width="130" height="64" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="1185.0" y="513.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">BERTScore</text>
  <text x="1185.0" y="530.0" text-anchor="middle" font-size="11" fill="#59636e">judge model</text>
  <path d="M 180 328 H 219" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 405 312 H 425 V 160 H 449" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 405 328 H 449" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 405 344 H 425 V 520 H 449" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 565 160 H 634" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 820 160 H 874" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 1060 160 H 1114" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 510 306 V 230 H 970 V 190" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="800" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#59636e">eval loss</text>
  <path d="M 565 520 H 634" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 530 180 V 250 H 600 V 412 H 634" fill="none" stroke="#0550ae" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="604" y="243" text-anchor="start" font-size="11" font-weight="600" fill="#0550ae">retrieval corpus</text>
  <text x="604" y="258" text-anchor="start" font-size="11" font-weight="400" fill="#0550ae">(train only, never test)</text>
  <rect x="516" y="348" width="168" height="26" rx="13" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="600" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#0550ae">assert_no_leakage()</text>
  <path d="M 730 444 V 480" fill="none" stroke="#0550ae" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <path d="M 820 518 H 874" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 1060 518 H 1114" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1090" y="468" text-anchor="middle" font-size="10" font-weight="400" fill="#59636e">continuation</text>
  <text x="1090" y="480" text-anchor="middle" font-size="10" font-weight="400" fill="#59636e">only</text>
  <rect x="30" y="576" width="372" height="92" rx="6" fill="none" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="46" y="600" text-anchor="start" font-size="12" font-weight="600" fill="#1f2328">Split fingerprint</text>
  <text x="46" y="620" text-anchor="start" font-size="11" font-weight="400" fill="#59636e">Both entry points print it. If the two runs report</text>
  <text x="46" y="636" text-anchor="start" font-size="11" font-weight="400" fill="#59636e">different fingerprints they are not talking about</text>
  <text x="46" y="652" text-anchor="start" font-size="11" font-weight="400" fill="#59636e">the same held-out set.</text>
  <path d="M 216 576 V 420 H 315 V 378" fill="none" stroke="#59636e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>
